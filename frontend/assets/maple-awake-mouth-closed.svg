<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Maple, awake, mouth closed">
  <defs>
    <radialGradient id="bodyGrad" cx="40%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#ff5ab3"/>
      <stop offset="60%" stop-color="#E90F8C"/>
      <stop offset="100%" stop-color="#a30662"/>
    </radialGradient>
    <radialGradient id="cheekGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ff85c8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff85c8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Ground shadow -->
  <ellipse cx="120" cy="222" rx="78" ry="8" fill="#000" opacity="0.10"/>
  <!-- Paddle tail behind body -->
  <ellipse cx="60" cy="195" rx="34" ry="13" fill="#7c5638"/>
  <path d="M40 188 Q50 184 60 188 M40 198 Q50 202 60 198 M50 184 L50 208 M70 184 L70 208"
        stroke="#5e4128" stroke-width="1.2" fill="none" opacity="0.6"/>
  <!-- Body with soft gradient -->
  <ellipse cx="120" cy="160" rx="62" ry="55" fill="url(#bodyGrad)"/>
  <!-- Belly highlight -->
  <ellipse cx="120" cy="180" rx="36" ry="28" fill="#ffd9ec" opacity="0.55"/>
  <!-- Vector pink scarf -->
  <path d="M70 115 Q120 102 170 115 L168 130 Q120 116 72 130 Z"
        fill="#a30662"/>
  <path d="M155 122 L182 155 L172 158 L150 130 Z"
        fill="#E90F8C"/>
  <circle cx="178" cy="158" r="3" fill="#FAAD1A"/>
  <!-- Hands (resting at sides) -->
  <ellipse cx="68" cy="170" rx="10" ry="9" fill="#6f4628"/>
  <ellipse cx="172" cy="170" rx="10" ry="9" fill="#6f4628"/>
  <!-- Feet -->
  <ellipse cx="92" cy="215" rx="14" ry="7" fill="#6f4628"/>
  <ellipse cx="148" cy="215" rx="14" ry="7" fill="#6f4628"/>
  <!-- Head -->
  <circle cx="120" cy="85" r="48" fill="url(#bodyGrad)"/>
  <!-- Ears -->
  <circle cx="88" cy="50" r="10" fill="#a30662"/>
  <circle cx="88" cy="50" r="5" fill="#ff85c8"/>
  <circle cx="152" cy="50" r="10" fill="#a30662"/>
  <circle cx="152" cy="50" r="5" fill="#ff85c8"/>
  <!-- Cheek blush -->
  <ellipse cx="85" cy="103" rx="11" ry="7" fill="url(#cheekGrad)"/>
  <ellipse cx="155" cy="103" rx="11" ry="7" fill="url(#cheekGrad)"/>
  <!-- Eyebrows (small, friendly) -->
  <path d="M88 62 Q102 56 116 62" stroke="#3a1530" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M124 62 Q138 56 152 62" stroke="#3a1530" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <!-- Glasses -->
  <circle cx="102" cy="80" r="16" fill="#ffffff" stroke="#222" stroke-width="2.4"/>
  <circle cx="138" cy="80" r="16" fill="#ffffff" stroke="#222" stroke-width="2.4"/>
  <line x1="118" y1="80" x2="122" y2="80" stroke="#222" stroke-width="2.4"/>
  <!-- Eyes -->
  <circle class="maple-eye" cx="102" cy="81" r="4" fill="#111"/>
  <circle class="maple-eye" cx="138" cy="81" r="4" fill="#111"/>
  <circle cx="103.5" cy="79" r="1.2" fill="#fff"/>
  <circle cx="139.5" cy="79" r="1.2" fill="#fff"/>
  <!-- Nose -->
  <ellipse cx="120" cy="100" rx="6" ry="4.5" fill="#222"/>
  <!-- Mouth closed: small smile -->
  <path d="M108 116 Q120 122 132 116" stroke="#222" stroke-width="2.4"
        fill="none" stroke-linecap="round"/>
  <!-- Front teeth peeking -->
  <rect x="115" y="118" width="4" height="6" fill="#fff" stroke="#222" stroke-width="0.6"/>
  <rect x="121" y="118" width="4" height="6" fill="#fff" stroke="#222" stroke-width="0.6"/>
</svg>
