[project]
name = "maple"
version = "0.1.0"
description = "DARMOD program demo. Maple the beaver, a Gemini-3-grounded agent about Vector Institute and Canadian AI."
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
exclude = ["tests/", "build/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
